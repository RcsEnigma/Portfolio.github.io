<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Not found — AJ Ambrozic</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0e0e0e; color: #e8e4dc; font-family: Consolas, Monaco, monospace;
         text-align: center; padding: 2rem; }
  p { margin: 0.6rem 0; font-size: 0.85rem; letter-spacing: 0.08em; color: #6b6860; }
  a { color: #c8b89a; text-decoration: none; }
  a:hover { opacity: 0.6; }
</style>
<script>
// A shared link to a work that was renamed or removed (/w/<name> or
// /full/w/<name>): skip the dead end and open the gallery instead.
(function () {
  var p = location.pathname;
  // a slide link whose page doesn't exist (/w/name--7): fall back to the work itself
  var slide = p.match(/^(\/(?:full\/)?w\/[^\/]+?)--\d+\/?$/);
  if (slide) location.replace(slide[1]);
  else if (/^\/full\/w\//.test(p)) location.replace("/full/");
  else if (/^\/w\//.test(p)) location.replace("/");
})();
</script>
</head>
<body>
  <div>
    <p>Nothing here.</p>
    <p><a href="/">Back to the portfolio</a></p>
  </div>
</body>
</html>
